name: Build book

# MANUAL TRIGGER ONLY. Run it from the Actions tab when you have edited a
# chapter on GitHub and want the site rebuilt without running `make book`
# locally.
#
# It deliberately does NOT run on every push. Figures are rendered by ragg,
# which produces different bytes on Linux than on macOS -- identical images,
# different files. With this workflow firing automatically, every push
# regenerated all nineteen figures and committed them, and the next local
# build regenerated them right back. The result was a commit of pure churn
# after every single change.
#
# Since docs/ is built and committed locally, this is only needed when editing
# through the GitHub web interface.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Binary packages from the Posit package manager, so this takes ~1 minute
      # rather than compiling everything from source.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::bookdown
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::BSDA

      - name: Render book
        run: Rscript -e 'bookdown::render_book("index.Rmd", "bookdown::gitbook")'

      - name: Commit rendered book
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch docs/.nojekyll
          git add docs
          if git diff --staged --quiet; then
            echo "No change in rendered output."
          else
            git commit -m "Rebuild book [skip ci]"
            git push
          fi
