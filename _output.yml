bookdown::gitbook:
  css: css/style.css
  highlight: tango
  split_by: section
  number_sections: true
  config:
    toc:
      collapse: subsection
      scroll_highlight: true
      before: |
        <li class="toc-logo"><a href="./"><strong>Statistics &amp; Econometrics with R</strong></a></li>
      after: |
        <li class="toc-after">Kedar Kulkarni · Azim Premji University<br>
        <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></li>
    toolbar:
      position: fixed
    search:
      engine: fuse
    fontsettings:
      theme: white
      family: sans
      size: 2
    # Puts an "edit" pencil on every page, pointing at that chapter's source.
    # A student who spots a typo can open a pull request without cloning
    # anything, which is most of the value of publishing the source at all.
    edit: https://github.com/kedarkulkarni1991/stats-econometrics-r/edit/main/%s
    sharing:
      github: yes
      facebook: no
      twitter: no
      linkedin: no
      weibo: no
      instapaper: no
      vk: no
      whatsapp: no
      all: no
    info: false
