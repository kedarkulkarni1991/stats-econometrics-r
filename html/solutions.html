<script>
// Solutions are written as plain fenced divs in the source, so the PDF edition
// can typeset them as boxes. On the web they should stay hidden until asked
// for, so wrap each one in a <details> here.
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("div.solution").forEach(function (div) {
    var d = document.createElement("details");
    d.className = "solution";
    var s = document.createElement("summary");
    s.textContent = "Show the solution";
    d.appendChild(s);
    while (div.firstChild) d.appendChild(div.firstChild);
    div.parentNode.replaceChild(d, div);
  });
});
</script>
